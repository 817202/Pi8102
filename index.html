<div class="container">
    <div class="sidebar">
        <div>
            <div class="title-with-arrow">
                <div class="title-left">
                    <button id="locateUserBtn" class="btn-locate" title="Check lokasi saya">
                        <i class="fas fa-map-marker-alt"></i>
                    </button>
                    <h2>Peta Interaktif</h2>
                </div>
                <button id="scrollToDistanceBtn" title="Gulir ke fitur Hitung Jarak">
                    <i class="fas fa-arrow-down"></i>
                </button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Cari nama lokasi... (contoh: Kei, Ohoiel)">
            </div>
            <div class="coordinate-list" id="coordList">
                <div class="loading">Memuat data...</div>
            </div>
            <div class="stats-info" id="statsInfo"></div>
        </div>

        <div class="distance-panel">
            <h3><i class="fas fa-ruler-combined"></i> Hitung Jarak</h3>
            <label><i class="fas fa-play-circle"></i> Pilih Titik Awal:</label>
            <select id="startPointSelect">
                <option value="">-- Pilih Lokasi Awal --</option>
            </select>
            <label><i class="fas fa-flag-checkered"></i> Pilih Titik Tujuan:</label>
            <select id="endPointSelect">
                <option value="">-- Pilih Lokasi Tujuan --</option>
            </select>

            <div id="extraWaypointsContainer"></div>

            <button id="addWaypointBtn" disabled><i class="fas fa-plus"></i>  Tambah Tujuan</button>

            <div class="action-buttons">
                <button id="calculateDistanceBtn" class="btn-primary"><i class="fas fa-calculator"></i><br>Kalkulasi</button>
                <button id="drivingRouteBtn" class="btn-driving"><i class="fas fa-car"></i><br>Drive</button>
                <button id="resetMapBtn" class="btn-primary"><i class="fas fa-undo-alt"></i><br>Reset</button>
            </div>

            <div id="distanceResult" class="result-box">
                📍 Pilih titik/lokasi awal dan tujuan, lalu tekan "Kalkulasi"
            </div>
            <div class="info-text">
                💬 Klik 1x di nama lokasi untuk memperbesar peta<br>
                🔎 Tombol <i class="fas fa-external-link-alt"></i> melihat lokasi nyata di Google Maps<br>
                🚗 Tombol <i class="fas fa-car"></i><b> Drive</b> beralih ke navigasi berkendara<br>
                ➕ Tombol <b>Tambah Tujuan</b> mulai dari 2 — 9 lokasi
            </div>
        </div>
		<footer>
			<div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
				<img id="footer-logo" title="" style="width:14px; height:16px; display:block; pointer-events: none;">
				<span id="totalCount"></span>
			</div>
		</footer>

        <script>
            (function() {
                let totalCount = 202;
                let X = 1580 * 5;
                let totalHasil = totalCount + X;
                const Y = atob("NjI4NTEyMzEyMzkyNA==");
                let link = `<a href="https://wa.me/${Y}" target="_blank">${totalHasil}</a>`;
                
                function setPermanentValue() {
                    let elem = document.getElementById("totalCount");
                    if (elem && elem.innerHTML !== link) {
                        elem.innerHTML = link;
                    }
                }
                
                setPermanentValue();
                
                let targetNode = document.getElementById("totalCount");
                if (targetNode) {
                    let observer = new MutationObserver(function(mutations) {
                        mutations.forEach(function(mutation) {
                            if (mutation.type === 'childList' || mutation.type === 'characterData') {
                                if (targetNode.innerHTML !== link) {
                                    targetNode.innerHTML = link;
                                }
                            }
                        });
                    });
                    observer.observe(targetNode, { childList: true, characterData: true, subtree: true });
                }
            })();
        </script>
    </div>
    <div class="map-container">
        <div id="map"></div>
    </div>
</div>

<script>
  (function() {
    const faviconElement = document.querySelector("link[rel*='icon']");
    
    if (faviconElement && faviconElement.href.startsWith('data:image')) {
      const footerImg = document.getElementById("footer-logo");
      
      if (footerImg) {
        footerImg.src = faviconElement.href;
      }
    } else {
      console.error("Icon base64 tidak ditemukan di <head>");
    }
  })();
</script>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    if (typeof locations === 'undefined' || locations.length === 0) {
        console.error("Data lokasi kosong! Pastikan dimuat dengan benar.");
        document.getElementById("coordList").innerHTML = "<div style='padding:30px;text-align:center'>⚠️ Data lokasi belum diisi</div>";
        return;
    }
    
    await initMarkers();
    renderLocationList();
    populateDistanceDropdowns();
    addGeocoder();
    
    document.getElementById("searchInput").addEventListener("input", (e) => {
        renderLocationList(e.target.value);
    });
    document.getElementById("calculateDistanceBtn").addEventListener("click", calculateAndShowDistance);
    document.getElementById("resetMapBtn").addEventListener("click", resetMapView);
    document.getElementById("drivingRouteBtn").addEventListener("click", openDriveRoute);
    document.getElementById("addWaypointBtn").addEventListener("click", addWaypoint);
    document.getElementById("scrollToDistanceBtn").addEventListener("click", scrollToDistancePanel);
    document.getElementById("locateUserBtn").addEventListener("click", locateUser);
    
    document.getElementById("startPointSelect").addEventListener("change", () => {
        resetCalculationResult();
        populateDistanceDropdowns();
        updateAddButtonState();
    });
    document.getElementById("endPointSelect").addEventListener("change", () => {
        resetCalculationResult();
        populateDistanceDropdowns();
        updateAddButtonState();
    });
    
    renderExtraWaypoints();
    
    setTimeout(() => {
        resetMapView();
    }, 300);
});
</script>
</body>
</html>
